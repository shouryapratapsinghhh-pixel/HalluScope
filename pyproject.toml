[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halluscope"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn", "torch", "transformers", "pyyaml", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs a real (tiny) transformer forward pass"]
